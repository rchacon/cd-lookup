name: WordPress Plugin Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check tag version matches plugin header
        id: version
        run: scripts/check-tag-version.sh "$GITHUB_REF_NAME" v cd-lookup/cd-lookup.php

      - name: Build plugin zip
        working-directory: cd-lookup
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p /tmp/build/cd-lookup
          cp -r cd-lookup.php src templates README.md /tmp/build/cd-lookup/
          cd /tmp/build
          zip -r "$GITHUB_WORKSPACE/cd-lookup-${VERSION}.zip" cd-lookup

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "cd-lookup-${{ steps.version.outputs.version }}.zip" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
